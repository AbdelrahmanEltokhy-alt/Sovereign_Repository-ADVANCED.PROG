<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sovereign — Car Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="form-page">
        <div class="form-card">
            <!--
              th:text — shows "Edit Car" if the car already has an ID (editing),
              or "Add New Car" if id is 0 (new car).
            -->
            <h1 th:text="${car.id != 0} ? 'Edit Car' : 'Add New Car'">Car Form</h1>

            <!--
              th:object="${car}" binds this form to the Car object from the model.
              th:field="*{name}" is shorthand for th:name="name" th:value="${car.name}".
              @ModelAttribute in AdminController.saveCar() reads all these fields back.
              Same pattern as Lect7's task-form.html but using th:object binding.
            -->
            <form th:action="@{/admin/cars/save}" th:object="${car}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Hidden ID field — needed so JPA knows to UPDATE, not INSERT -->
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" th:field="*{model}" required>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="number" th:field="*{year}" required>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" step="0.01" th:field="*{price}" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" th:field="*{imageUrl}" placeholder="/images/cars/yourcar.jpg">
                </div>

                <button type="submit" class="btn-primary">Save Car</button>
                <a th:href="@{/admin/cars}" class="btn-secondary">Cancel</a>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
