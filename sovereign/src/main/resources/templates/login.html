<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sovereign — Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="form-page">
        <div class="form-card">
            <h1>Login</h1>

            <!--
              Spring Security handles the POST to /login automatically.
              You don't need a controller method for this form submission.
              The input names MUST be "username" and "password" — 
              Spring Security looks for exactly these names.
            -->
            <form th:action="@{/login}" method="post">

                <!-- Spring Security adds a CSRF token automatically for security.
                     Without it the form submission will be blocked. -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- ?error param is added by Spring Security on failed login -->
                <p th:if="${param.error}" class="error-msg">
                    Invalid username or password.
                </p>

                <!-- ?logout param is added by Spring Security after logout -->
                <p th:if="${param.logout}" class="success-msg">
                    You have been logged out.
                </p>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Login</button>

                <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
