<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sovereign - Inquiry</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="form-page">
    <div class="form-card">
        <h1>Send Inquiry</h1>

        <form th:action="@{/inquiry}" th:object="${inquiry}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" required>
                <p class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required>
                <p class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" th:field="*{message}" required></textarea>
                <p class="error-msg" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></p>
            </div>

            <button type="submit" class="btn-primary">Submit</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
