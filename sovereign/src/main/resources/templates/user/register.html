<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sovereign — Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="form-page">
        <div class="form-card">
            <h1>Create Account</h1>

            <!--
              POST /user/register is handled by UserController.processRegister().
              @RequestParam reads username, email, password from this form.
              th:action="@{/user/register}" generates the correct URL automatically.
            -->
            <form th:action="@{/user/register}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- ${error} is set in the model by UserController if registration fails -->
                <p th:if="${error}" th:text="${error}" class="error-msg"></p>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Register</button>

                <p>Already have an account? <a th:href="@{/user/login}">Login here</a></p>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
