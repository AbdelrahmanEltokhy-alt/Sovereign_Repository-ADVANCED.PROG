spring.application.name=sovereign

# ── H2 In-Memory Database (local development) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:sovereigndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql runs first to create tables in correct order (cars before car_colors/mods)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# none — schema.sql already created tables; Hibernate should not touch DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# H2 web console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


